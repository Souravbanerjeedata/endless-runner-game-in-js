<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless Runner - City & Forest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas1"></canvas>

    <!-- Level transition modal -->
    <div id="levelModal" class="modal">
      <div class="modal-content">
        <h1>Level 1 Complete!</h1>
        <p>Victory! The city is clear.</p>
        <p>Ready for the Forest?</p>
        <div class="modal-buttons">
          <button id="btnContinue">Continue to Level 2</button>
          <button id="btnQuit">Quit</button>
        </div>
      </div>
    </div>

    <!-- Player -->
    <img src="assets/player.png" id="player" />

    <!-- City layers -->
    <img src="assets/layer-1.png" id="layer1" />
    <img src="assets/layer-2.png" id="layer2" />
    <img src="assets/layer-3.png" id="layer3" />
    <img src="assets/layer-4.png" id="layer4" />
    <img src="assets/layer-5.png" id="layer5" />

    <!-- Forest layers -->
    <img src="assets/forest-layer-1.png" id="forest-layer1" />
    <img src="assets/forest-layer-2.png" id="forest-layer2" />
    <img src="assets/forest-layer-3.png" id="forest-layer3" />
    <img src="assets/forest-layer-4.png" id="forest-layer4" />
    <img src="assets/forest-layer-5.png" id="forest-layer5" />

    <!-- City enemies -->
    <img src="assets/enemy_fly.png" id="enemy_fly" />
    <img src="assets/enemy_plant.png" id="enemy_plant" />
    <img src="assets/enemy_spider_big.png" id="enemy_spider_big" />

    <!-- Forest ground enemies -->
    <img src="assets/enemy_digger.png" id="enemy_digger" />
    <img src="assets/enemy_ground_zombie.png" id="enemy_ground_zombie" />
    <img src="assets/enemy_zombie.png" id="enemy_zombie" />
    <img src="assets/enemy_worm.png" id="enemy_worm" />
    <img src="assets/enemy_hand.png" id="enemy_hand" />

    <!-- Forest flying enemies -->
    <img src="assets/enemy_ghost_4.png" id="enemy_ghost_4" />
    <img src="assets/enemy_ghost_3.png" id="enemy_ghost_3" />
    <img src="assets/enemy_ghost_2.png" id="enemy_ghost_2" />
    <img src="assets/enemy_bat_3.png" id="enemy_bat_3" />
    <img src="assets/enemy_raven.png" id="enemy_raven" />
    <img src="assets/enemy_spider.png" id="enemy_spider" />
    <img src="assets/enemy_spinner.png" id="enemy_spinner" />

    <!-- Effects -->
    <img src="assets/fire.png" id="fire" />
    <img src="assets/boom.png" id="collisionAnimation" />
    <img src="assets/heart.png" id="lives" />

    <script type="module" src="main.js"></script>
  </body>
</html>
